name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Keep automated checks data-free; the modeling entry points are never executed here.
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MPLBACKEND: Agg
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_INPUT: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12.3"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e .
          python -m pip install ruff==0.15.20
          python -m pip check
      - name: Lint
        run: ruff check --no-cache src scripts tests
      - name: Check formatting
        run: ruff format --no-cache --check src scripts tests
      - name: Test
        env:
          MPLCONFIGDIR: ${{ runner.temp }}/matplotlib
          NUMBA_CACHE_DIR: ${{ runner.temp }}/numba
          XDG_CACHE_HOME: ${{ runner.temp }}/cache
        run: python -B -m unittest discover -s tests -v

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12.3"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Build package
        run: |
          python -m pip install --upgrade pip build
          python -m build
