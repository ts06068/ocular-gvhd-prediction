[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ocular-gvhd-prediction"
version = "0.1.0"
description = "Modular XGBoost landmark modeling for ocular GVHD prediction"
requires-python = ">=3.12,<3.13"

[tool.setuptools.packages.find]
where = ["src"]
include = ["ogvhd_prediction*"]
